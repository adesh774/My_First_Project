<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #ffffff;
    text-align: center;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

.welcome-container {
    background-color: rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    max-width: 480px;
    margin: 100px auto;
    padding: 30px 25px;
    animation: fadeIn 1.5s ease-out;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

h1 {
    font-size: 2.8em;
    margin: 0;
    animation: slideDown 1.2s ease-out;
    letter-spacing: 1px;
}

p {
    font-size: 1.3em;
    margin: 20px 0 0;
    animation: fadeInText 2s ease-in-out;
    color: #e0e0e0;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-60px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInText {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.animation-background {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
    overflow: hidden;
}

.circle {
    position: absolute;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    animation: moveCircles 6s infinite ease-in-out alternate;
}

@keyframes moveCircles {
    0% {
        transform: translateY(0px) rotate(0deg);
    }
    50% {
        transform: translateY(40px) rotate(90deg);
    }
    100% {
        transform: translateY(0px) rotate(180deg);
    }
}

    </style>
</head>
<body>
    <div class="animation-background">
        <div class="circle" style="width: 100px; height: 100px; left: 10%; top: 20%;"></div>
        <div class="circle" style="width: 150px; height: 150px; left: 70%; top: 40%;"></div>
        <div class="circle" style="width: 80px; height: 80px; left: 40%; top: 70%;"></div>
    </div>
    <div class="welcome-container">
        <h1>Welcome!</h1>
        <p>You have successfully signed in.</p>
    </div>
</body>
</html>
